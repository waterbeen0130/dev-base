<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추천코스 테스트</title>
<link rel="stylesheet" href="reset.css">
<style>
.main_sec_1 { position:relative;  }
.main_sec_1 .bg_img_area { position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; }
.main_sec_1 .bg_img_area img { width:100%; height:100%; object-fit:cover; }
.main_sec_1_inner { display:flex; flex-direction:column; padding:140px 50px; gap:70px; }
.main_sec_1 .tit_wrap { display:flex; flex-direction:column; align-items:center; gap:40px; }
.main_sec_1 .tit_box { display:flex; flex-direction:column; align-items:center; gap:10px; }
.main_sec_1 .tit_main { display:flex; align-items:center; gap:10px; }
.main_sec_1 .tit_main span { font-family:'Gmarket Sans', sans-serif; font-size:2.8125rem; line-height:1.3; letter-spacing:-0.03em; color:#1d1d1d; }
.main_sec_1 .highlight { display:flex; align-items:center; }
.main_sec_1 .highlight span { font-family:'Gmarket Sans', sans-serif; font-weight:500; font-size:2.8125rem; line-height:1.3; letter-spacing:-0.03em; color:#f58220; }
.main_sec_1 .highlight .img_area { width:50px; height:50px; }
.main_sec_1 .sub_tit { font-family:'Gmarket Sans', sans-serif; font-size:1.25rem; line-height:1.4; letter-spacing:-0.03em; color:#616161; }
.main_sec_1 .tag_wrap { display:flex; align-items:center; gap:25px; }
.main_sec_1 .arrow_l, .main_sec_1 .arrow_r { width:40px; height:40px; }
.main_sec_1 .tag_list { display:flex; gap:16px; }
.main_sec_1 .tag_list li a { display:block; padding:0px 18px; height:40px; line-height:40px; border-radius:2em; font-family:'Gmarket Sans', sans-serif; font-size:1rem; letter-spacing:-0.01em; }
.main_sec_1 .tag_list li a.active { background:#f58220; color:#fff; font-weight:500; }
.main_sec_1 .tag_list li a:not(.active) { background:#ebebeb; color:#343434; }
.main_sec_1 .course_list { display:flex; justify-content:center; gap:25px; }
.main_sec_1 .course_list li { width:344px; height:480px; background:#f5f5f5; border-radius:30px; overflow:hidden; }
.main_sec_1 .course_list li .img_area { height:370px; }
.main_sec_1 .course_list li .img_area img { width:100%; height:100%; object-fit:cover; }
.main_sec_1 .course_list li .txt_box { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:110px; }
.main_sec_1 .course_list li strong { font-weight:700; font-size:1.5625rem; line-height:1; letter-spacing:-0.02em; color:#212121; text-align:center; }
.main_sec_1 .course_list li span { font-size:1.0625rem; line-height:1.3; letter-spacing:-0.02em; color:#424242; text-align:center; }
</style>
</head>
<body>
<div class="main_sec_1">
    <div class="main_sec_1_inner">
        <div class="tit_wrap">
            <div class="tit_box">
                <div class="tit_main">
                    <span>영월반값여행</span>
                    <div class="highlight">
                        <span>추천코스</span>
                        <div class="img_area">
                            <img src="img/ic_map.png" alt="map icon">
                        </div>
                    </div>
                </div>
                <span class="sub_tit">자연과 문화, 다채로움이 있는 여행</span>
            </div>
            <div class="tag_wrap">
                <div class="img_area arrow_l">
                    <img src="img/ic_arrow_l_1.png" alt="left arrow">
                </div>
                <ul class="tag_list">
                    <li><a href="#" class="active">#핫플</a></li>
                    <li><a href="#">#자연과 힐링</a></li>
                    <li><a href="#">#문화와 역사</a></li>
                    <li><a href="#">#액티비티</a></li>
                    <li><a href="#">#반려견 동반여행</a></li>
                </ul>
                <div class="img_area arrow_r">
                    <img src="img/ic_arrow_r_1.png" alt="right arrow">
                </div>
            </div>
        </div>
        <ul class="course_list">
            <li>
                <div class="img_area">
                    <img src="img/mask_group.png" alt="선암마을 한반도지형">
                </div>
                <div class="txt_box">
                    <strong>선암마을 한반도지형</strong>
                    <span>하늘에서 보면 한반도 모양으로 생긴 강 지형</span>
                </div>
            </li>
            <li>
                <div class="img_area">
                    <img src="img/mask_group_1.png" alt="청령포">
                </div>
                <div class="txt_box">
                    <strong>청령포</strong>
                    <span>단종이 유배되었던 역사적인 장소</span>
                </div>
            </li>
            <li>
                <div class="img_area">
                    <img src="img/mask_group_2.png" alt="별마로 천문대">
                </div>
                <div class="txt_box">
                    <strong>별마로 천문대</strong>
                    <span>영월에서 가장 유명한 야경 관광지</span>
                </div>
            </li>
            <li>
                <div class="img_area">
                    <img src="img/mask_group_3.png" alt="고씨굴">
                </div>
                <div class="txt_box">
                    <strong>고씨굴</strong>
                    <span>천연기념물로 지정된 석회암 동굴</span>
                </div>
            </li>
            <li>
                <div class="img_area">
                    <img src="img/in_img.png" alt="동강">
                </div>
                <div class="txt_box">
                    <strong>동강</strong>
                    <span>영월군을 흐르는 대표적인 자연 관광지</span>
                </div>
            </li>
        </ul>
    </div>
    <div class="bg_img_area">
      <img src="img/sec_1_recommend_bg.png" alt="">
    </div>
</div>
</body>
</html>
