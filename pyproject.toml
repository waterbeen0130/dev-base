[project]
name = "dev-base"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.42",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: exercises live network-dependent Adobe XD extraction flows",
]
