# AUTO-GENERATED MARKER GUIDE (for tools/build-rules.py)
# ---------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for all project rules.
# Edit rules HERE, then run `python3 tools/build-rules.py` to regenerate:
#   - rules/common.md
#   - rules/basic.md
#   - rules/landing.md
#   - rules/validation_schema.json
#
# Generated artifacts MUST contain a header comment such as:
#   <!-- AUTO-GENERATED FROM rules/rules.yaml — DO NOT EDIT -->
# so editors know not to hand-modify them.
# ---------------------------------------------------------------

schema_version: 1
generated_at: null  # build-rules.py fills this when regenerating artifacts

description: |
  Single Source of Truth for all rules in this project.
  Edit this file directly. tools/build-rules.py will regenerate
  rules/common.md, basic.md, landing.md, validation_schema.json from this file.

validation_types:
  - regex_must_not_match    # CSS/HTML가 패턴에 매칭되면 위반
  - regex_must_match        # CSS/HTML가 패턴에 매칭되어야 통과
  - regex_should_match      # 권장 패턴 (warning 수준)
  - ast_selector_count      # CSS 셀렉터 카운트 기반 검사
  - value_equals_mapping    # Figma mapping.json 값과 1:1 일치 검사
  - html_tag_required       # 특정 HTML 구조/태그 필수
  - forbidden_substring     # 단순 substring 금지
  - required_substring      # 단순 substring 필수
  - naming_pattern          # 클래스/파일명 네이밍 패턴
  - numeric_range           # 숫자 범위 검사 (e.g. 깊이 ≤ 5)
  - custom                  # 커스텀 핸들러 (custom_handler 필드 필수)

profiles:
  - common
  - basic
  - landing
  - figma
  - enhancement

severities:
  - error        # 반드시 수정 (CRITICAL)
  - warning      # 수정 권장 (MAJOR)
  - info         # 권장 사항 (MINOR)
  - deprecated   # 더 이상 사용하지 않는 룰 (T02가 출력 제외)

precedence:
  description: |
    Rule 충돌 시 우선순위는 priority(낮을수록 우선)로 결정한다.
    priority가 같으면 severity 강도(error > warning > info > deprecated)로 비교한다.
    둘 다 같으면 id 오름차순으로 안정적으로 정렬한다.
  priority_defaults:
    error: 100
    warning: 200
    info: 300
    deprecated: 900
  conflict_resolution_order:
    - priority_asc
    - severity_rank_desc
    - id_asc

categories:
  - css.layout
  - css.color
  - css.format
  - css.units
  - css.naming
  - css.variables
  - css.selector
  - css.typography
  - css.border
  - css.spacing
  - css.image
  - html.structure
  - html.semantic
  - html.naming
  - html.image
  - html.text
  - accessibility
  - figma.mapping
  - figma.fidelity
  - figma.text
  - figma.asset
  - spec.schema
  - process
  - enhancement.workflow

rules:

  # ===== HTML structure / depth / naming =====

  - id: max_dom_depth
    description: "DOM 최대 깊이는 5단계를 초과하지 않는다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.structure
    validation:
      type: numeric_range
      target: html
      pattern: "depth<=5"
    rationale: "과도한 wrapper 중첩 방지로 마크업 단순화"

  - id: snake_case_naming
    description: "HTML 클래스명은 snake_case 만 사용한다 (kebab-case, camelCase 금지)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: naming_pattern
      target: html
      pattern: "^[a-z0-9_]+$"

  - id: page_prefix_required
    description: "페이지 prefix는 섹션 컨테이너에만 부여한다 ({페이지}_{역할} 패턴, 예: main_intro, main_product). index.html은 main_ prefix를 사용한다. 기타 서브페이지는 파일명이 prefix (greeting.html → greeting_). 자식 요소는 짧은 역할명(.card, .list, .title_area)으로 선언하고 CSS는 .main_intro .card 형태로 부모 스코핑한다. 자식에 부모 prefix를 중첩하지 않는다 (.main_intro_card 금지 → .main_intro .card). 공통 영역(header/footer/gnb/logo/container/utils/sns)은 prefix 없이 사용."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: naming_pattern
      target: html
      pattern: "^[a-z][a-z0-9]*_[a-z0-9_]+$"

  - id: no_forbidden_class
    description: "sec_1, sec_2, section_01 같은 범용 클래스명을 금지한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: forbidden_substring
      target: html
      pattern: "sec_\\d+|section_\\d+|box\\d+"
    examples:
      bad: "<section class=\"sec_3\"><div class=\"box5\">"
      good: "<section class=\"about_intro\">"

  - id: common_area_child_scope
    description: "공통영역 자식 클래스(.logo, .gnb, .utils, .sns, .copyright, .logo_txt 등)는 .header/.footer 부모 셀렉터와 함께 선언한다. 단독 선언(.logo{}, .gnb a{})은 header/footer 양쪽 충돌 위험으로 금지."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.selector
    validation:
      type: custom
      target: css
      custom_handler: check_common_area_child_scope
    examples:
      bad: ".logo{...}  /  .gnb a{...}"
      good: ".header .logo{...}  /  .header .gnb a{...}"

  - id: global_class_standalone
    description: "전역 클래스(.header, .footer, .cont, .img_area)는 body/html 등 부모를 붙이지 않고 단독 선언한다. 섹션 레벨 오버라이드(.main_intro .cont)는 허용."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.selector
    validation:
      type: custom
      target: css
      custom_handler: check_global_class_standalone
    examples:
      bad: "body .header{...}  /  html .cont{...}"
      good: ".header{...}  /  .cont{...}  /  .main_intro .cont{...}"

  - id: no_figma_nodeid_class
    description: "Figma 노드명을 그대로 박은 클래스(main_f0, main_v53, main_t12, hero_v2 같은 {접두}_{f|v|t}{숫자} 패턴)를 금지한다. 디자이너 레이어 식별자이며 시맨틱 의미가 없다. 페이지 prefix + 역할명(main_intro, greeting_title)을 사용한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: forbidden_substring
      target: html
      pattern: "[a-z]+_[fvt][0-9]+"
    examples:
      bad: "<div class=\"main_f0\"><span class=\"main_v53\"><p class=\"main_t12\">"
      good: "<div class=\"main_intro\"><span class=\"main_visual\">"

  - id: generic_class_name
    description: "sec_숫자, section_숫자, box숫자 같은 범용 클래스명을 모두 금지한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: regex_must_not_match
      target: html
      pattern: "(sec_\\d+|section_\\d+|box\\d+)\""

  - id: meaningful_page_name
    description: "의미 있는 영문 페이지명을 위해 HTML 파일명 + 본문(class/markup) 모두에서 page_1/sub_01 같은 기계식 이름을 금지한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: regex_must_not_match
      target: html
      pattern: "(page_\\d+|sub_\\d+|page_[a-z]$)"

  - id: page_filename_class_prefix_match
    description: "CSS 클래스 프리픽스는 HTML 파일명과 일치해야 한다 (greeting.html → greeting_)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: custom
      target: html
      custom_handler: page_filename_class_prefix_match

  - id: no_body_class
    description: "body 태그에 class 속성을 추가하지 않는다 — body는 공통 영역이므로 페이지별 class 금지."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    validation:
      type: regex_must_not_match
      target: html
      pattern: "<body[^>]*\\bclass\\s*="

  - id: common_area_prefix
    description: "header/footer/gnb/logo/container/utils/sns/copyright 같은 공통 영역에 페이지 프리픽스를 사용하지 않는다. 공통 영역은 어떤 페이지(index.html, greeting.html 등)에 있어도 prefix 없이 사용한다. 이 규칙은 page_prefix_required 보다 항상 우선한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    examples:
      bad: ".index_header, .main_footer, .sub_container, .index_gnb"
      good: ".header, .footer, .container, .gnb (모든 페이지에서 prefix 없이 동일)"
    validation:
      type: custom
      target: html
      custom_handler: check_common_area_prefix

  # ===== CSS format / structure =====

  - id: selector_single_line
    description: "각 CSS 셀렉터 규칙은 한 줄로 작성한다 (여러 줄 펼침 금지). 콤마 셀렉터 3개 이상이면 셀렉터만 줄바꿈, 속성은 마지막 셀렉터 뒤에 한 줄로 붙인다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: check_selector_format

  - id: no_duplicate_selector
    description: "같은 셀렉터를 미디어쿼리 밖에서 중복 선언하지 않는다 (한 번만 선언)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.selector
    validation:
      type: custom
      target: css
      custom_handler: check_duplicate_selectors

  - id: media_query_format
    description: "@media 내부 규칙은 줄바꿈 분리하되 들여쓰기 없이 작성한다. 한 줄에 모든 규칙을 이어붙이지 않는다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: check_media_indent

  - id: no_media_indent
    description: "@media 블록 내부 규칙에 들여쓰기를 사용하지 않는다."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: check_media_indent

  - id: empty_media_block
    description: "@media 블록 본문이 공백/주석뿐이면 빈 블록으로 간주하고 금지한다 (@media print 예외)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: _check_empty_media_block

  - id: clamp_threshold
    description: "100px 미만 값에는 clamp()를 사용하지 않는다 (고정 px). 100px 이상만 clamp 허용."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: css.units
    validation:
      type: regex_must_not_match
      target: css
      pattern: "clamp\\(\\s*([0-9]|[1-9][0-9])px"

  - id: no_clamp_under_100
    description: "padding/margin에 100px 미만 clamp()를 사용하지 않는다."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: css.units
    validation:
      type: custom
      target: css
      custom_handler: check_clamp_under_100

  - id: no_raw_calc
    description: "calc()는 clamp() 내부에서만 사용한다. 단독 사용 금지."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.units
    validation:
      type: custom
      target: css
      custom_handler: check_raw_calc_vw

  - id: no_raw_vw
    description: "vw 단위는 clamp() 내부에서만 사용한다. 단독 사용 금지."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.units
    validation:
      type: custom
      target: css
      custom_handler: check_raw_calc_vw

  - id: large_side_padding
    description: "좌우 padding 100px 이상이면 max-width + margin:auto 패턴으로 변환해야 한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.spacing
    validation:
      type: custom
      target: css
      custom_handler: check_large_side_padding

  - id: max_width_pattern
    description: "좌우 padding 100px 이상이 발견되면 max-width 기반 레이아웃 패턴 사용을 권장한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.spacing
    validation:
      type: custom
      target: css
      custom_handler: check_max_width_pattern

  # ===== Color =====

  - id: hex_color_only
    description: "색상은 hex 전용 (#fff, #090944). rgb()/hsl() 금지. 투명도 필요 시만 rgba() 허용."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.color
    validation:
      type: regex_must_not_match
      target: css
      pattern: "(?<!rgba)\\brgb\\(|hsl\\("
    examples:
      bad: "color: rgb(255,255,255);"
      good: "color: #fff;"

  - id: no_hex8_literal
    description: "8자리 hex 리터럴(#RRGGBBAA)은 사용하지 않는다 (주석 및 url(data:) 내부는 제외)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.color
    validation:
      type: custom
      target: css
      custom_handler: _check_no_hex8_literal

  # ===== Layout =====

  - id: flexbox_layout
    description: "레이아웃은 flexbox만 사용한다 (Grid/float 금지)."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.layout
    validation:
      type: regex_must_not_match
      target: css
      pattern: "display\\s*:\\s*grid|float\\s*:\\s*(left|right)"

  - id: no_column_flex_gap
    description: "flex-direction:column 컨테이너에서는 gap을 사용하지 않는다 (수직 간격은 margin 사용)."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.layout
    validation:
      type: custom
      target: css
      custom_handler: check_no_column_gap

  - id: no_important
    description: "!important는 사용하지 않는다 (mb_/mt_/txt_c 등 유틸리티 클래스만 예외)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: check_important

  - id: box_sizing_redundant
    description: "universal reset(*, *::before, *::after) 외 box-sizing:border-box 중복 선언을 금지한다."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: _check_box_sizing_redundant

  # ===== Border / radius =====

  - id: border_radius_no_999
    description: "border-radius는 원형 50%, pill 2em을 사용한다. 999px는 금지."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.border
    validation:
      type: forbidden_substring
      target: css
      pattern: "999px"
    examples:
      bad: "border-radius: 999px;"
      good: "border-radius: 2em;"

  - id: no_heuristic_border
    description: "레이아웃 패턴이나 .card+.card 같은 인접 셀렉터로 border를 추측해 넣지 않는다."
    severity: error
    priority: 100
    applies_to: [common, figma]
    category: css.border
    validation:
      type: regex_must_not_match
      target: css
      pattern: "\\.[a-z0-9_-]+\\s*\\+\\s*\\.[a-z0-9_-]+\\s*\\{[^}]*border"

  - id: no_adjacent_selector_border
    description: ".item+.item{border-left/top:...} 패턴 금지 — 대신 divider 노드를 DOM 요소로 사용한다."
    severity: error
    priority: 100
    applies_to: [common, figma]
    category: css.border
    validation:
      type: regex_must_not_match
      target: css
      pattern: "\\+\\s*\\.[a-z0-9_-]+\\s*\\{[^}]*border-(left|top|right|bottom)"

  # ===== Typography =====

  - id: line_height_ratio_only
    description: "line-height는 무단위 비율(1.3, 1.45)만 사용한다. 25.866px 같은 computed px 금지."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.typography
    validation:
      type: regex_must_not_match
      target: css
      pattern: "line-height\\s*:\\s*[\\d.]+px"
    examples:
      bad: "line-height: 25.866px;"
      good: "line-height: 1.45;"

  - id: line_height_tidy_ratio
    description: "line-height 무단위 비율은 정돈 후보 목록(1.0, 1.1, 1.2, 1.25, 1.3, 1.4, 1.45, 1.5, 1.6, 1.667, 1.75, 1.8, 2.0) 중 하나를 사용한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.typography
    validation:
      type: custom
      target: css
      custom_handler: _check_line_height_tidy_ratio

  - id: letter_spacing_unit
    description: "letter-spacing은 em 단위를 사용한다. px는 절대값 2px 이하 미세 조정 시에만 허용."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.typography
    validation:
      type: custom
      target: css
      custom_handler: check_letter_spacing_unit

  - id: font_size_pc_rem
    description: "basic 프로젝트: PC font-size는 rem 단위, 모바일(@media max-width:768px)에서만 px 사용."
    severity: warning
    priority: 200
    applies_to: [basic]
    category: css.typography
    validation:
      type: custom
      target: css
      custom_handler: check_font_size_base

  - id: font_size_landing_px
    description: "landing 프로젝트: 모든 font-size는 PC/모바일 모두 고정 px만 사용 (rem 사용 금지)."
    severity: warning
    priority: 200
    applies_to: [landing]
    category: css.typography
    validation:
      type: regex_must_not_match
      target: css
      pattern: "font-size\\s*:\\s*[\\d.]+rem"

  - id: landing_unit_mixed_scale
    description: "landing 프로파일에서 html/body font-size에 clamp|vw|rem|calc 혼용을 금지한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.typography
    validation:
      type: custom
      target: css
      custom_handler: _check_landing_unit_mixed_scale

  - id: font_family_redundant
    description: "동일 font-family fallback 체인이 *, body, 개별 selector에 과다 반복되면 중복으로 간주한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.typography
    validation:
      type: custom
      target: css
      custom_handler: _check_font_family_redundant

  - id: word_break_korean
    description: "한국어 텍스트 단락/헤딩에는 word-break: keep-all을 적용한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.typography
    validation:
      type: required_substring
      target: css
      pattern: "keep-all"

  - id: font_size_base
    description: "html,body에 font-size: clamp(14px, 1.2vw, 16px) 기준 선언이 필요하다 (basic 프로젝트)."
    severity: warning
    priority: 200
    applies_to: [basic]
    category: css.typography
    validation:
      type: required_substring
      target: css
      pattern: "font-size:clamp("

  # ===== :root variables =====

  - id: root_var_line_separated
    description: ":root{} 안의 CSS 변수는 각 줄에 하나씩 선언한다 (한 줄에 여러 변수 금지)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.variables
    validation:
      type: custom
      target: css
      custom_handler: check_root_vars

  - id: root_var_naming
    description: ":root 변수는 --point-color-N, --width, --padding 같은 패턴을 따른다 (시맨틱 이름 금지)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.variables
    validation:
      type: custom
      target: css
      custom_handler: root_var_naming

  - id: root_vars_required
    description: "landing 프로젝트는 :root에 --padding, --header_h, --width, --point-color-1 4개 변수가 모두 존재해야 한다."
    severity: warning
    priority: 200
    applies_to: [landing]
    category: css.variables
    validation:
      type: required_substring
      target: css
      pattern: "--padding,--header_h,--width,--point-color-1"

  # ===== HTML semantic / text =====

  - id: no_inline_style
    description: "인라인 style 속성을 사용하지 않는다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.semantic
    validation:
      type: regex_must_not_match
      target: html
      pattern: "style=\""

  - id: no_empty_div
    description: "빈 div(<div></div>) 사용 금지."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.semantic
    validation:
      type: regex_must_not_match
      target: html
      pattern: "<div[^>]*>\\s*</div>"

  - id: inner_wrapper_limit
    description: "내부 wrapper div는 최대 1개로 제한한다 (불필요한 중첩 금지)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.structure
    validation:
      type: numeric_range
      target: html
      pattern: "inner_wrapper<=1"

  - id: forbidden_tag
    description: "<figure>, <figcaption>, <main>, <article> 태그는 사용하지 않는다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.semantic
    validation:
      type: regex_must_not_match
      target: html
      pattern: "<figure|<figcaption|<main\\b|<article\\b"

  - id: nav_ul_li_structure
    description: "<nav> 안에는 ul>li>a 구조를 사용한다 (직접 <a> 나열 금지)."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.semantic
    validation:
      type: custom
      target: html
      custom_handler: check_nav_structure

  - id: list_pattern_required
    description: "반복되는 <a> 태그는 ul>li 구조 안에 배치한다 (연속 <a> 2개 이상 금지)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.semantic
    validation:
      type: custom
      target: html
      custom_handler: check_list_pattern

  - id: img_wrapped
    description: "모든 <img> 태그는 .img_area 래퍼 안에 배치한다 (CSS 배경 이미지만 제외). 로고, 아이콘, 파트너 로고 등 예외 없음."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.image
    validation:
      type: custom
      target: html
      custom_handler: check_img_wrapper

  - id: img_no_fixed_size
    description: "img 및 .img_area에 고정 width/height CSS를 선언하지 않는다. 로고 img는 어떤 크기 제어도 금지 (img width/height, 부모 flex-basis/max-width 모두 금지 — 원본 사이즈 그대로 출력). 일반 이미지는 크기가 필요하면 부모 컨테이너에서 제어한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.image
    validation:
      type: custom
      target: css
      custom_handler: check_img_no_fixed_size

  - id: no_background_size
    description: "background-size 선언을 금지한다. --download-assets가 이미지를 Figma 디자인 1:1 크기로 추출하므로 background-size가 불필요하다. spec.json의 scaleMode/scalingFactor/imageTransform은 Figma 내부 렌더링 파라미터이며 CSS로 변환하면 안 된다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.image
    examples:
      bad:
        - "background-size:cover → 삭제"
        - "background-size:contain → 삭제"
        - "background-size:200px 300px → 삭제"
      good:
        - "background-size 없이 background-image만 선언"
        - "이미지 크기는 부모 컨테이너에서 제어"
    validation:
      type: custom
      target: css
      custom_handler: check_no_background_size

  - id: img_alt_concise
    description: "img alt 텍스트는 짧고 간결하게 (한국어 문장 전체 금지)."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: accessibility
    validation:
      type: custom
      target: html
      custom_handler: img_alt_concise

  - id: img_naming
    description: "이미지 파일명은 snake_case 의미 있는 이름이어야 한다 (Figma node ID 그대로 금지)."
    severity: error
    priority: 100
    applies_to: [common, figma]
    category: html.image
    validation:
      type: custom
      target: html
      custom_handler: check_image_naming

  - id: minimal_aria
    description: "aria-label은 시각적 텍스트가 없는 인터랙티브 요소에만 사용한다 (남용 금지)."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: accessibility
    validation:
      type: custom
      target: html
      custom_handler: minimal_aria

  - id: p_tag_condition_enforced
    description: "<p> 태그는 텍스트에 \\n이 있거나, 길이 95자 초과거나, 종결어미 반복일 때만 사용. 짧은 라벨은 <span> 사용."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: html.text
    validation:
      type: custom
      target: html
      custom_handler: check_p_tag_misuse

  - id: p_tag_misuse
    description: "20자 미만 짧은 텍스트에 <p> 태그를 사용하지 않는다 — <span> 사용."
    severity: info
    priority: 300
    applies_to: [common, basic, landing]
    category: html.text
    validation:
      type: custom
      target: html
      custom_handler: check_p_tag_misuse

  - id: newline_to_br_required
    description: "spec.json 텍스트의 \\n 및 \\u2028은 HTML에서 반드시 <br> 태그로 변환한다. HTML 원문에 \\n을 그냥 두면 브라우저가 무시하므로 <br>로 명시 변환 필수. 연속 \\n\\n은 블록 분리(</p><p>) 또는 <br><br>로 처리."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.text
    rationale: "거의 모든 프로젝트에서 외주 에이전트가 \\n → <br> 변환을 누락하여 줄바꿈이 사라지는 문제 반복 발생."
    validation:
      type: custom
      target: html
      custom_handler: check_newline_to_br

  # ===== CSS selector hierarchy =====

  - id: selector_scoped
    description: "셀렉터는 페이지/섹션 스코프 안에 작성한다 (전역 단일 클래스 셀렉터 지양)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.selector
    validation:
      type: custom
      target: css
      custom_handler: selector_scoped

  - id: no_utility_classes
    description: ".font_serif, .weight_bold 같은 유틸리티 클래스를 사용하지 않는다 — 부모 셀렉터에서 직접 처리."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.selector
    validation:
      type: regex_must_not_match
      target: css
      pattern: "\\.(font|weight|color|size)_"

  - id: excessive_individual_classes
    description: "같은 접두사 클래스가 5개 이상이면 부모 스코핑(.parent .child) + 태그 셀렉터로 축소해야 한다. 자식에 부모 prefix를 중첩하지 않는다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.selector
    validation:
      type: custom
      target: css
      custom_handler: check_excessive_individual_classes

  # ===== Reset / common css =====

  - id: reset_css_separate
    description: "basic 프로젝트: reset.css는 별도 파일로 분리한다."
    severity: warning
    priority: 200
    applies_to: [basic]
    category: css.format
    validation:
      type: required_substring
      target: html
      pattern: "reset.css"

  - id: reset_duplicate
    description: "common.css에 reset.css의 핵심 패턴(* margin/padding/box-sizing 등)을 중복 작성하지 않는다."
    severity: warning
    priority: 200
    applies_to: [common, basic]
    category: css.format
    validation:
      type: custom
      target: css
      custom_handler: check_reset_duplicate

  # ===== Mobile-specific =====

  - id: mobile_spacing_half
    description: "basic 프로젝트 768px 이하: padding/margin은 PC 값의 약 절반 사용."
    severity: info
    priority: 300
    applies_to: [basic]
    category: css.spacing
    validation:
      type: custom
      target: css
      custom_handler: mobile_spacing_half

  # ===== Landing-specific =====

  - id: gsap_animation_css_present
    description: "landing 프로젝트는 [data-delay] opacity/position 룰과 .section_on 토글 룰이 있어야 한다."
    severity: warning
    priority: 200
    applies_to: [landing]
    category: css.format
    validation:
      type: required_substring
      target: css
      pattern: "[data-delay]"

  # ===== Figma extraction fidelity =====

  - id: text_byte_exact_required
    description: "Figma spec의 text_nodes[].characters는 HTML에 byte-exact 존재해야 한다 (NBSP/특수공백 포함)."
    severity: error
    priority: 100
    applies_to: [figma]
    category: figma.text
    validation:
      type: custom
      target: text
      custom_handler: validate_text_byte_exact
    examples:
      bad: "Figma '운영시간\\xa0  10:00' → HTML '운영시간 10:00' (NBSP 소실)"
      good: "byte-exact 복사"

  - id: asset_manifest_consistency
    description: "asset_manifest.json 과 HTML <img src> 는 양방향 일치해야 한다 (통이미지 금지)."
    severity: error
    priority: 100
    applies_to: [figma]
    category: figma.asset
    validation:
      type: custom
      target: html
      custom_handler: validate_asset_manifest_consistency
    examples:
      bad: "HTML 에 asset_manifest 미등록 이미지 (AI 합성 의심)"
      good: "HTML 이미지 전부 asset_manifest 등록된 Figma 원본"

  # ===== Figma v2 policy sync (REQ-029) =====

  - id: vertical_frame_itemspacing_uses_margin_bottom
    description: "Figma VERTICAL frame 의 itemSpacing > 0 은 자식 요소의 margin-bottom 으로 변환한다. column flex gap / row-gap 사용 금지."
    severity: error
    priority: 100
    applies_to: [common, basic, landing, figma]
    category: figma.mapping
    validation:
      type: custom
      target: css
      custom_handler: enforce_policy1_vertical_margin_bottom

  - id: no_constraints_to_position_absolute_mapping
    description: "Figma constraints 는 spec 에 추출만 하고 CSS position:absolute 등 절대 배치로 매핑하지 않는다. 본 프로젝트는 flexbox 전용 레이아웃을 유지한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing, figma]
    category: figma.mapping
    validation:
      type: custom
      target: spec
      custom_handler: enforce_policy2_constraints_extract_only

  - id: figma_rules_conflict_uses_meta_marker
    description: "Figma 값이 rules.yaml 위반을 유발하면 spec 노드에 `rules_conflict: { rule_id, figma_value, applied_value }` 메타를 기록하고, validator 는 해당 노드에서 그 rule 을 PASS 처리한다 (false-positive 방지)."
    severity: error
    priority: 100
    applies_to: [common, basic, landing, figma]
    category: figma.fidelity
    validation:
      type: custom
      target: spec
      custom_handler: enforce_policy3_rules_conflict_bypass

  # ===== AGI-003 new rules =====

  - id: html_formatting
    description: "HTML 태그는 적절히 줄바꿈하고 4-space 들여쓰기를 적용한다. 자식 태그가 2개 이상이거나 줄 길이가 80자를 초과하면 반드시 줄바꿈한다."
    severity: error
    priority: 300
    applies_to: [common, basic, landing]
    category: html.structure
    rationale: "복잡한 중첩 태그를 한 줄로 이어붙이면 가독성이 저하됨"
    examples:
      bad: |
        <ul><li>A</li><li>B</li><li>C</li></ul>
        <div class="card"><span class="img_area"><img src="img/photo.jpg" alt=""></span><span class="title">Title</span></div>
      good: |
        <ul>
            <li>A</li>
            <li>B</li>
            <li>C</li>
        </ul>
        <div class="card">
            <span class="img_area"><img src="img/photo.jpg" alt=""></span>
            <span class="title">Title</span>
        </div>
    validation:
      type: custom
      target: html
      custom_handler: html_formatting

  - id: no_decorative_empty_tag
    description: "장식 목적의 빈 span/div/i 태그 사용을 금지한다. CSS ::before/::after 가상 선택자로 대체한다. 예외: 아이콘 폰트 <i>, 빈 셀 <td>, JavaScript 동적 조작 요소."
    severity: warning
    priority: 300
    applies_to: [common, basic, landing]
    category: html.semantic
    rationale: "의미 없는 빈 태그는 접근성 저하와 마크업 비대화를 유발"
    validation:
      type: custom
      target: html
      custom_handler: no_decorative_empty_tag

  - id: media_query_by_section
    description: "CSS 파일에서 미디어쿼리는 3대 영역(header / main 페이지 콘텐츠 / footer) 단위로 기본 CSS 바로 아래에 해당 영역의 breakpoint를 작성한다. main 내부 개별 섹션마다 @media를 쪼개지 않고, main 전체 base CSS 후 main 전체 @media를 breakpoint별로 모아 작성한다. 파일 하단에 전체 미디어쿼리를 몰아넣는 구조도 금지."
    severity: warning
    priority: 300
    applies_to: [common, basic, landing]
    category: css.format
    rationale: "3대 영역 단위 분리로 유지보수성 향상. 섹션별 과도한 분리 방지"
    validation:
      type: custom
      target: css
      custom_handler: media_query_by_section

  - id: generic_class_parent_scope
    description: "페이지 prefix 섹션(.main_visual, .main_news 등) 내부의 모든 자식 클래스는 반드시 부모 섹션 셀렉터와 함께 선언한다. 범용적 이름인지 판단하지 않는다 — 섹션 내부이면 무조건 부모를 붙인다."
    severity: warning
    priority: 300
    applies_to: [common, basic, landing]
    category: css.selector
    rationale: "섹션 내부 클래스가 부모 스코핑 없이 단독 선언되면 다른 페이지/섹션과 충돌 가능"
    validation:
      type: custom
      target: css
      custom_handler: generic_class_parent_scope

  # ===== AGI-003 추가 규칙 (이오스인테리어 프로젝트 피드백) =====

  - id: no_section_id
    description: "퍼블리싱에서 <section> 태그에 id 속성을 사용하지 않는다. 앵커 링크가 필요하면 내부 요소에 id를 부여한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.structure
    rationale: "section id는 JS 프레임워크 패턴이며 퍼블리싱에서는 클래스 기반 선택이 표준"
    validation:
      type: regex_must_not_match
      target: html
      pattern: "<section[^>]*\\bid\\s*="
    examples:
      bad: "<section id=\"about\">"
      good: "<section class=\"main_about\">"

  - id: no_wrapper_class
    description: "eos_site, wrap_all, page_wrapper 같은 비표준 전체 래퍼 클래스를 금지한다. 전체 페이지 래퍼가 필요하면 기존 body 또는 시멘틱 태그를 활용한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    rationale: "비표준 래퍼는 불필요한 DOM 깊이를 추가하고 프로젝트 간 일관성을 해침"
    validation:
      type: custom
      target: html
      custom_handler: check_no_wrapper_class
    examples:
      bad: "<div class=\"eos_site\">, <div class=\"wrap_all\">"
      good: "body 직속으로 header/section/footer 배치"

  - id: no_min_width_wrapper
    description: "페이지 래퍼 또는 body에 min-width를 선언하지 않는다. 반응형 레이아웃에서 min-width는 모바일 대응을 방해한다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.layout
    rationale: "min-width:1200px 같은 선언은 모바일에서 가로 스크롤을 강제함"
    validation:
      type: custom
      target: css
      custom_handler: check_no_min_width_wrapper

  - id: font_variable_required
    description: "non-reset 폰트 선언은 CSS 변수(--font, --font2 등)와 CDN @import를 사용한다. common.css에 직접 font-family:'Pretendard' 같은 하드코딩을 하지 않는다 (reset.css의 @font-face 선언은 예외)."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.typography
    rationale: "폰트를 변수화하면 프로젝트 간 폰트 교체가 용이하고 CDN 관리가 통합됨"
    validation:
      type: custom
      target: css
      custom_handler: check_font_variable_required

  - id: child_prefix_nesting
    description: "자식 클래스에 부모 prefix를 중첩하지 않는다. main_project_list 같은 패턴은 .main_project .list 로 부모 스코핑해야 한다. 섹션 컨테이너 자체(main_project)의 2-토큰 네이밍은 허용."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: css.naming
    rationale: "prefix 중첩은 클래스명이 길어지고 스코핑 구조가 CSS에 반영되지 않음"
    validation:
      type: custom
      target: css
      custom_handler: check_child_prefix_nesting
    examples:
      bad: ".main_project_list{...}, .main_intro_card_icon{...}"
      good: ".main_project .list{...}, .main_intro .card img{...}"

  - id: cont_class_required
    description: "섹션 내부 너비 제한에는 .cont 공통 클래스를 사용한다. eos_inner, sec_inner, content_wrap 같은 커스텀 inner wrapper 클래스를 금지한다."
    severity: error
    priority: 100
    applies_to: [common, basic, landing]
    category: html.naming
    rationale: ".cont는 common.css에 전역 선언된 표준 패턴이며 커스텀 inner wrapper는 일관성을 해침"
    validation:
      type: custom
      target: html
      custom_handler: check_cont_class_required
    examples:
      bad: "<div class=\"eos_inner\">, <div class=\"sec_inner\">"
      good: "<div class=\"cont\">"

  - id: reset_property_duplicate
    description: "reset.css에 이미 선언된 속성(a{color:inherit}, img{max-width}, font-family, font-size 등)을 common.css에서 중복 선언하지 않는다."
    severity: warning
    priority: 200
    applies_to: [common, basic, landing]
    category: css.format
