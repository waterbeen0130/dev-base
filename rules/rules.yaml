  # ===== Figma → CSS decision tree (PLN-007 follow-up) =====

  - id: figma_alignment_axis_mapping
    description: "Figma primaryAxis/counterAxis 정렬은 layoutMode에 따라 CSS justify-content/align-items 매핑이 바뀐다."
    severity: info
    applies_to: [common, basic, landing, figma]
    category: figma.mapping
    rationale: |
      기존 문서는 primaryAxisAlignItems→justify-content 1:1 매핑만 명시했고
      layoutMode에 따른 축 전환(HORIZONTAL: primary=수평, VERTICAL: primary=수직)은 빠져 있어서
      세션마다 매핑 결과가 달라졌다.

      Decision tree:
      ┌─ layoutMode == HORIZONTAL
      │    primaryAxis(수평)  → justify-content
      │    counterAxis(수직)  → align-items
      │
      ├─ layoutMode == VERTICAL
      │    primaryAxis(수직)  → justify-content  (flex-direction:column 전제)
      │    counterAxis(수평)  → align-items
      │
      └─ layoutMode == NONE
           children absolute positioned — CSS 정렬 속성 미사용

      Value mapping (양쪽 축 공통):
        MIN           → flex-start
        CENTER        → center
        MAX           → flex-end
        SPACE_BETWEEN → space-between  (primary axis only)

      textAlignHorizontal → text-align (LEFT/CENTER/RIGHT/JUSTIFIED)
      textAlignVertical   → 무시 (inline 요소는 vertical-align 대신 부모 align-items로 처리)
    validation:
      type: documentation
      target: none

  - id: gap_vs_margin_decision
    description: "Figma itemSpacing → CSS gap 또는 margin 선택은 간격 균일성·layoutMode·정렬 복잡도로 결정한다."
    severity: info
    applies_to: [common, basic, landing, figma]
    category: figma.mapping
    rationale: |
      기존 문서는 '동일 간격이면 gap, 다르면 margin'이라는 정성적 판단만 제시했다.
      이번 룰은 수치 임계치와 decision tree로 고정한다.

      Step 1 — 간격 균일성 측정:
        적응성 판정: child 간 실측 간격의 max - min 값
        ≤ 1px  → "완전 균일" (gap 사용 가능)
        ≤ 3px  → "거의 균일" (gap 허용, 1px 오차는 pixel snap)
        > 3px  → "비균일" (개별 margin 강제)

      Step 2 — layoutMode별 분기:

        layoutMode == HORIZONTAL:
          - 균일 → display:flex; flex-direction:row; gap:{itemSpacing}px;
          - 비균일 → display:flex; flex-direction:row; + 자식별 margin-left:{gap_n}px
                    (첫 자식 제외, `.parent > * + * {margin-left:Xpx}` 관용구)

        layoutMode == VERTICAL:
          - 균일 + 정렬 제어 필요(align-items 사용) → display:flex; flex-direction:column
                    + 자식별 margin-top (common.md no_column_gap 규칙상 column에 gap 금지)
          - 균일 + 정렬 제어 불필요 → display:block; 자식별 margin-top 동일값
          - 비균일 → display:block; 자식별 margin-top 개별값

      Step 3 — 관용구:
        - `.parent > * + * {margin-top:Xpx}` 이 표준 (첫 자식 margin 불필요)
        - 방향은 항상 `margin-top` (다음 자식 위쪽에 붙임), `margin-bottom` 금지
        - 단, 마지막 자식 특수 margin-bottom 이 필요하면 허용

      Step 4 — 혼합 케이스:
        - HORIZONTAL wrap 레이아웃에서 `row-gap`/`column-gap` 분리 지정 가능
        - gap의 두 값 형식 `gap: row column;` 는 허용
    validation:
      type: documentation
      target: none

  - id: figma_item_count_rule
    description: "Figma 카드/리스트 아이템 개수 결정: 고유 bbox 슬롯 수 + component variant dedup + instance 그룹."
    severity: info
    applies_to: [common, basic, landing, figma]
    category: figma.fidelity
    rationale: |
      기존 룰이 전무했기 때문에 text_nodes[] 개수로 카드 수를 추정했고 component variant overlap 시
      variant를 별개 카드로 오인하는 사례가 반복됐다. 이 규칙은 figma_cardinality_match 와 짝으로 동작한다.

      카드 개수 결정 알고리즘:

      Step 1 — 리스트 컨테이너 식별:
        부모 frame이 layoutMode=HORIZONTAL (또는 VERTICAL) + children 중
        같은 componentId(또는 같은 size 반복) 인스턴스가 2개 이상 → "list container"

      Step 2 — 카드 후보 수집:
        list container의 direct children 중:
        - type == INSTANCE (component instance)
        - width/height 동일 (±2px)
        - 또는 frame name 패턴이 동일 (예: list_img_company, list_card 등)

      Step 3 — Variant dedup:
        같은 bbox.x 에 ±3px 이내로 겹치는 인스턴스 → component variant overlap으로 간주
        → 첫 번째 인스턴스만 카드로 계수 (나머지는 상태 variant)

        판단 근거: Figma에서 `I<instance_id>;<variant_id>;...` 형태로 parent_id 접두사가 같으면
        같은 컴포넌트 set의 다른 variant.

      Step 4 — HTML 변환:
        카드 수 N → `<ul class="XXX_list"><li>` × N
        각 li는 type=INSTANCE의 visible default variant 하나만 사용

      Step 5 — 검증:
        figma_cardinality_match 룰이 HTML <li> 수와 Step 4의 N을 자동 대조하여 불일치 시 CRITICAL.
    validation:
      type: documentation
      target: none

  # ===== Figma structural checks (PLN-007 follow-up) =====

  - id: figma_dom_tree_structure_match
    description: "섹션별 Figma top-level frame children 수와 HTML main section direct children 수가 대략 일치해야 한다 (±2)."
    severity: warning
    applies_to: [common, basic, landing, figma]
    category: figma.fidelity
    rationale: |
      텍스트와 카드 개수만 맞아도 DOM 구조가 완전히 다를 수 있다 (래퍼 중첩/생략).
      이 룰은 섹션 최상위 frame의 direct children 개수를 HTML 섹션의 direct children과 대조해
      구조 근사 일치를 확인한다. ±2 허용 (label span 등 작은 요소 차이 허용).
    validation:
      type: custom
      target: html
      custom_handler: figma_dom_tree_structure_match

  - id: figma_text_row_grouping
    description: "Figma에서 같은 y 좌표에 있는 텍스트들은 HTML에서 공통 block 조상을 공유해야 한다 (완전히 다른 섹션/트리에 분리 금지)."
    severity: warning
    applies_to: [common, basic, landing, figma]
    category: figma.fidelity
    rationale: |
      Figma 가로 row 레이아웃(같은 y에 여러 텍스트)을 HTML에서 세로 stack으로 잘못 구현하는 실수 방지.
      실제 케이스: 목포플레이파크 footer 주소 행 "전라남도/사업자등록번호/대표이사"가 같은 y이지만
      HTML은 <span class="address_line"> × 7개 세로 stack으로 작성돼 있었다.

      알고리즘:
      1. spec.json text_nodes를 y ±5px 으로 버킷화
      2. 버킷에 ≥2개 텍스트가 있으면 "horizontal row" 후보
      3. 각 텍스트의 HTML 부모 체인을 찾아 immediate parent가 같은지 확인
      4. parent 시그니처가 다르면 → 구조 오류 (세로 스택으로 잘못 구현)
    validation:
      type: custom
      target: html
      custom_handler: figma_text_row_grouping

  - id: figma_element_parent_match
    description: "Figma landmark 요소(btn_top/logo_b/sns)의 HTML 부모 체인에 기대 조상 클래스가 존재해야 한다."
    severity: warning
    applies_to: [common, basic, landing, figma]
    category: figma.fidelity
    rationale: |
      특정 landmark 요소(top 버튼, 로고, sns 등)가 잘못된 부모 안에 중첩되는 실수 방지.
      실제 케이스: 목포 TOP 버튼이 footer_info의 sibling이 아닌 footer_address 내부에 중첩.

      landmark 이름 → 기대 조상 클래스 hint 기반 체크. 느슨한 검사 (hint 중 하나만 맞으면 PASS).
    validation:
      type: custom
      target: html
      custom_handler: figma_element_parent_match

  # ===== Figma cardinality match (PLN-007 follow-up) =====

  - id: figma_cardinality_match
    description: "Figma 카드 슬롯 수(component variant dedup 후) == HTML main section <li> 수. variant를 별개 카드로 오인 방지."
    severity: error
    applies_to: [common, basic, landing]
    category: figma.fidelity
    rationale: |
      Figma 컴포넌트 variant(default/hover/state 등)가 같은 위치에 stacked되어 있으면
      text_nodes로 뽑을 때 variant 수만큼 중복이 나온다. HTML 작성자가 이를 별개 카드로
      오인하면 카드 수가 잘못됨. 예: 에이스디펜스 main_company는 Figma 3 슬롯 + 2 variant
      overlap이지만 HTML이 4 카드로 작성됐던 실제 사례.
    validation:
      type: custom
      target: html
      custom_handler: figma_cardinality_match

  # ===== Section width formula (PLN-007 follow-up) =====

  - id: section_width_formula
    description: "섹션 폭 공식 강제: --width = Figma inner content width + 40, --padding = 20px, .cont 클래스 패턴 필수, 섹션은 full-bleed + background, 너비 제한은 .cont 내부에서만."
    severity: error
    applies_to: [common, basic, landing]
    category: css.layout
    rationale: |
      프로젝트마다 반복되는 실수 방지: section에 Figma inner padding(240 등)을 직접 이식해
      background가 가운데만 나오고 content 정렬이 깨지는 문제. 공식을 코드로 강제한다.

      공식:
      - :root { --width: <figma_content_width + 40>; --padding: 20px; }
      - .cont { width: 100%; max-width: var(--width); margin: 0 auto; padding: 0 var(--padding); }
      - 배경이 있는 섹션은 full-width 유지 (max-width 직접 선언 금지, .cont 하위 사용)
      - border-box 기준 .cont 내부 content = --width - 2*--padding = Figma content width
    validation:
      type: custom
      target: css
      custom_handler: section_width_formula

  # ===== Figma text fidelity =====

  - id: text_from_spec_required
    description: "extracted/*_spec.json의 text_nodes[].characters는 반드시 HTML에 나타나야 한다. AI가 텍스트를 추론/축약/복원하면 안 된다."
    severity: error
    applies_to: [common, figma, basic, landing]
