<!DOCTYPE html>
<html lang="ko" xml:lang="ko">
<head>
<title></title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, user-scalable=0, initial-scale=1, minimum-scale=1, maximum-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="../img/logo.png">
<meta property="og:url" content="">
<link rel="canonical" href="">
<link rel="stylesheet" href="../css/common.css"/>
<script type="text/javascript" src="../js/jquery-3.7.1.min.js" charset="utf-8"></script>
<script type="text/javascript" src="../js/gsap.min.js"></script>
<script type="text/javascript" src="../js/ScrollTrigger.min.js"></script>
<script type="text/javascript" src="../js/slick.js" charset="utf-8"></script>
<script type="text/javascript" src="../js/ui_common.js" charset="utf-8"></script>
</head>

<body class="page_{name}">

<div id="wrap">

<!-- header -->
<header>
	<!-- project header here -->
</header>
<!-- //header -->

<!-- total_menu -->
<div class="total_menu_wrap">
	<!-- project total menu here -->
</div>
<!-- //total_menu -->

<div class="sub_wrap">
	<!-- sub visual -->
	<div class="sub_visual">
		<div class="inner">
			<!-- sub visual content -->
		</div>
	</div>

	<!-- breadcrumb -->
	<div class="breadcrumb">
		<div class="inner">
			<!-- breadcrumb items -->
		</div>
	</div>

	<!-- page title -->
	<div class="page_title">
		<div class="inner">
			<h3>{page_title}</h3>
		</div>
	</div>

	<!-- contents -->
	<div class="{page}_section">
		<div class="inner">
			<!-- tab menu -->
			<div class="tab_menu">
				<div class="tab_list">
					<a href="#" class="active">{tab_1}</a>
					<a href="#">{tab_2}</a>
					<a href="#">{tab_3}</a>
				</div>
			</div>

			<!-- list top (count + search) -->
			<div class="list_top">
				<span class="total_count"><!-- total count --></span>
				<div class="search_bar">
					<div class="select_box">
						<button type="button">{select_label}<i class="arrow"></i></button>
					</div>
					<div class="search_input">
						<input type="text" placeholder="{placeholder}" />
						<button type="button" class="btn_search" aria-label="search"></button>
					</div>
				</div>
			</div>

			<!-- list -->
			<div class="{page}_list">
				<div class="list_row">
					<div class="list_item">
						<a href="{view_url}">
							<div class="img_area">
								<img src="../img/{img}" alt="{alt}" />
							</div>
							<div class="txt_area">
								<h5>{title}</h5>
								<span class="desc">{description}</span>
								<span class="date">{date}</span>
							</div>
						</a>
					</div>
				</div>
			</div>

			<!-- list bottom -->
			<div class="list_bottom">
				<div class="btn_group">
					<!-- action buttons -->
				</div>
				<div class="pagination">
					<a href="#" class="btn_page first" aria-label="first page"></a>
					<a href="#" class="btn_page prev" aria-label="prev page"></a>
					<a href="#" class="num active">1</a>
					<a href="#" class="num">2</a>
					<a href="#" class="num">3</a>
					<a href="#" class="btn_page next" aria-label="next page"></a>
					<a href="#" class="btn_page last" aria-label="last page"></a>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- footer -->
<div class="footer">
	<!-- project footer here -->
</div>
<!-- //footer -->

</div>
<!-- //wrap -->

</body>
</html>
